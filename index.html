  const SKY_STOPS = [

  const SKY_BANDS = (function () {
    const stops = SKY_STOPS;
    const steps = 40;
    const bands = [];
    for (let i = 0; i < steps; i++) {
      const u = i / (steps - 1) * (stops.length - 1);
      const a = stops[Math.floor(u)];
      const b = stops[Math.min(stops.length - 1, Math.floor(u) + 1)];
      const t = u - Math.floor(u);
      const r = Math.round(a[0] + (b[0] - a[0]) * t);
      const g = Math.round(a[1] + (b[1] - a[1]) * t);
      const bl = Math.round(a[2] + (b[2] - a[2]) * t);
      bands.push("rgb(" + r + "," + g + "," + bl + ")");
    }
    return bands;
  })();
  const SKY_GRAY = [

  const PAL = {

  const GRASS_BLEND = SEG * 64;

  const canvas = document.getElementById("c");

  let segments = [];

  let recover = 0;
  let playerX = 0;
  let prevPosition = 0;
  let prevPlayerX = 0;
  let wheel = 0;
  let hillGrade = 0;
  let horizonScroll = 0;

  let viewH = 1;
  let phase = "title";
  let stage = 1;
  let grassAge = 0;
  let timeLeft = RACE_SECS;
  let countLeft = 0;
  let nextSpriteId = 1;
  let spriteStamp = 0;
  let traffic = [];
  function loadSprite(src) {
    const img = new Image();
    img.src = src;
    return img;
  }
  function sealCar(img) {
    const iw = img.naturalWidth;
    const ih = img.naturalHeight;
    const c = document.createElement("canvas");
    c.width = iw;
    c.height = ih;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.drawImage(img, 0, 0);
    const image = g.getImageData(0, 0, iw, ih);
    const px = image.data;
    const n = iw * ih;
    const bg = new Uint8Array(n);
    const stack = new Int32Array(n);
    let top = 0;
    function push(i) {
      if (i < 0 || i >= n || bg[i] || px[i * 4 + 3] > 32) return;
      bg[i] = 1;
      stack[top++] = i;
    }
    for (let x = 0; x < iw; x++) {
      push(x);
      push((ih - 1) * iw + x);
    }
    for (let y = 0; y < ih; y++) {
      push(y * iw);
      push(y * iw + iw - 1);
    }
    while (top) {
      const i = stack[--top];
      const x = i % iw;
      if (x > 0) push(i - 1);
      if (x + 1 < iw) push(i + 1);
      if (i >= iw) push(i - iw);
      if (i + iw < n) push(i + iw);
    }
    for (let i = 0; i < n; i++) {
      if (!bg[i]) px[i * 4 + 3] = 255;
    }
    g.putImageData(image, 0, 0);
    return c;
  }
  const SPRITES = {
    player: { img: loadSprite("player.png"), x: 33, y: 694, w: 987, h: 850 },
    cars: [
      { img: loadSprite("car_gray.png"), x: 23, y: 504, w: 999, h: 950 },
      { img: loadSprite("car_green.png"), x: 55, y: 579, w: 1093, h: 753 },
      { img: loadSprite("car_white.png"), x: 121, y: 382, w: 858, h: 1138 }
    ],
    sign: { img: loadSprite("sign.png"), x: 320, y: 1, w: 446, h: 1722 },
    billboard: { img: loadSprite("billboard.png"), x: 79, y: 203, w: 998, h: 1449 }
  };
  (function sealCarSprites() {
    const list = [SPRITES.player, SPRITES.cars[0], SPRITES.cars[1], SPRITES.cars[2]];
    for (let s = 0; s < list.length; s++) {
      const sp = list[s];
      const img = sp.img;
      function apply() {
        if (!img.naturalWidth) return;
        sp.img = sealCar(img);
      }
      if (img.complete && img.naturalWidth) apply();
      else img.addEventListener("load", apply);
    }
  })();
  const CAR_HALF = 0.084;
  const CAR_GAP = SEG * 48;
  let audioCtx = null;
  let engine = null;
  let muted = false;
  let bumping = false;
  let bumpGain = null;
  let extraGain = null;
  let rumble = null;
  let goalChimed = false;
  let rpm = 0.18;
  let engineVol = 0;
  const held = {};

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeIn(a, b, t) { return a + (b - a) * t * t; }
  function easeInOut(a, b, t) {
    return a + (b - a) * ((-Math.cos(t * Math.PI) / 2) + 0.5);
  }

  function lastY() {
    return segments.length ? segments[segments.length - 1].p2.world.y : 0;
  }

  function addSegment(curve, y) {
    const n = segments.length;
    segments.push({
      index: n,
      curve: curve,
      dark: Math.floor(n / RUMBLE) % 2 === 1,
      p1: { world: { y: lastY(), z: n * SEG }, camera: {}, screen: {} },
      p2: { world: { y: y, z: (n + 1) * SEG }, camera: {}, screen: {} }
    });
  }

  function addRoad(enter, hold, leave, curve, hill) {
    const startY = lastY();
    const endY = startY + hill * SEG;
    const total = enter + hold + leave;
    let n;
    for (n = 0; n < enter; n++)
      addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
    for (n = 0; n < hold; n++)
      addSegment(curve, easeInOut(startY, endY, (enter + n) / total));
    for (n = 0; n < leave; n++)
      addSegment(easeInOut(curve, 0, n / leave), easeInOut(startY, endY, (enter + hold + n) / total));
  }

  function closeHill() {
    const y = lastY();
    if (Math.abs(y) < 1) {
      if (segments.length) segments[segments.length - 1].p2.world.y = 0;
      return;
    }
    const steps = 200;
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      addSegment(0, y * (1 - easeInOut(0, 1, t)));
    }
    segments[segments.length - 1].p2.world.y = 0;
  }

  function layCourse1() {
    addRoad(50, 180, 50, 0, 0);
    addRoad(40, 150, 40, 2, 0);
    addRoad(40, 70, 40, 0, 32);
    addRoad(35, 110, 35, -3, 8);
    addRoad(40, 70, 40, -1, -40);
    addRoad(28, 55, 28, 4.5, 0);
    addRoad(36, 60, 36, 1, 34);
    addRoad(26, 48, 26, -4.5, 6);
    addRoad(34, 70, 34, 2.5, -30);
    addRoad(40, 170, 40, -2, 0);
    addRoad(30, 36, 30, 0, 18);
    addRoad(30, 36, 30, 0, -26);
    addRoad(30, 40, 30, 0, 14);
    addRoad(36, 120, 36, 3, 12);
    addRoad(40, 140, 40, -3, -16);
    addRoad(36, 80, 36, 2, 10);
    addRoad(40, 90, 40, -4, -8);
    closeHill();
    addRoad(50, 120, 50, 0, 0);
  }

  function layCourse2() {

    addRoad(32, 100, 32, -2.6, 14);
    addRoad(24, 36, 24, -4.8, 0);
    addRoad(34, 60, 34, 3.8, 24);
    addRoad(26, 40, 26, 4.6, -16);
    addRoad(40, 110, 40, 0, -30);
    addRoad(30, 80, 30, -3.4, 10);
    addRoad(22, 34, 22, 4.8, 18);
    addRoad(36, 90, 36, -1.6, 28);
    addRoad(32, 70, 32, -4.4, -32);
    addRoad(38, 80, 38, 2.4, 0);
    addRoad(28, 50, 28, 4.2, 20);
    addRoad(42, 36, 42, -2.2, -24);
    addRoad(30, 100, 30, 3.4, 12);
    addRoad(34, 48, 34, -4.6, -18);
    addRoad(26, 80, 26, 1.4, 22);
    addRoad(36, 120, 36, -2.8, 8);
    addRoad(32, 70, 32, 3.6, -14);
    addRoad(40, 60, 40, 0, -18);

    addRoad(48, 150, 48, 0, 0);
  }

  function layCourse3() {
    addRoad(30, 50, 30, 0, 0);
    addRoad(44, 180, 44, -3.4, 10);
    addRoad(22, 32, 22, 5.6, -6);
    addRoad(40, 80, 40, 2.2, 36);
    addRoad(48, 40, 48, -1.4, 8);
    addRoad(30, 50, 30, -5.2, -28);
    addRoad(40, 130, 40, 2.8, -12);
    addRoad(28, 44, 28, -4.6, 22);
    addRoad(34, 90, 34, 4.2, 6);
    addRoad(22, 32, 22, -5.4, -18);
    addRoad(50, 100, 50, 1.2, 30);
    addRoad(26, 48, 26, 4.8, 0);
    addRoad(42, 80, 42, -3.0, -34);
    addRoad(32, 60, 32, 3.6, 16);
    addRoad(38, 110, 38, -2.4, 8);
    addRoad(24, 40, 24, 5.0, -14);
    addRoad(46, 70, 46, -4.0, 18);
    addRoad(30, 90, 30, 2.0, -10);
    addRoad(36, 44, 36, 0, -8);
    closeHill();
    addRoad(46, 160, 46, 0, 0);
  }

  function buildCourse(which) {
    segments = [];
    if (which === 3) layCourse3();
    else if (which === 2) layCourse2();
    else layCourse1();
    trackLength = segments.length * SEG;
    placeSprites();
    placeTraffic();
  }

  function addSprite(i, kind, variant, offset) {
    const seg = segments[i];
    if (!seg) return;
    if (!seg.sprites) seg.sprites = [];
    seg.sprites.push({
      id: nextSpriteId++,
      kind: kind,
      variant: variant,
      offset: offset,
      z: seg.p1.world.z,
      y: seg.p1.world.y,
      t: 0,
      stamp: 0
    });
  }

  function placeSprites() {
    const n = segments.length;
    for (let i = 18; i < n - 16; i += 14) {
      const band = (i / 14) | 0;
      const side = band % 2 === 0 ? 1 : -1;
      const sign = band % 5 === 4;
      const variant = band % 3;
      const out = ((i * 13) % 4) * 0.08;
      if (sign) addSprite(i, "sign", band % 2, side * (1.72 + out));
      else addSprite(i, "tree", variant, side * ((variant === 2 ? 2.2 : 1.9) + out));
    }
  }

  function addTraffic(i, variant, offset, pace, weave, amp, phase) {
    const seg = segments[i];
    if (!seg) return;
    traffic.push({
      id: nextSpriteId++,
      kind: "car",
      variant: variant,
      offset: offset,
      z: seg.p1.world.z,
      y: seg.p1.world.y,
      t: 0,
      stamp: 0,
      speed: maxSpeed * pace,
      homeZ: seg.p1.world.z,
      lane: offset,
      weave: weave,
      amp: amp,
      phase0: phase,
      phase: phase,
      gone: false,
      prevZ: seg.p1.world.z,
      prevOffset: offset
    });
  }

  function placeTraffic() {
    traffic = [];
    const n = segments.length;
    const count = 56;
    const edge = 90;
    if (n <= edge * 2 + count) return;
    const gap = Math.floor((n - edge * 2) / count);
    const lanes = [-0.46, 0.4, -0.14, 0.5, -0.38, 0.18, -0.5, 0.28];
    const paces = [0.47, 0.78, 0.91, 0.58, 0.86, 0.64, 0.94, 0.52, 0.73, 0.89];
    for (let c = 0; c < count; c++) {
      const i = edge + gap * c + Math.floor(gap * 0.5);
      if (i < 0 || i >= n - 40) continue;
      const amp = 0.12 + (c % 4) * 0.03;
      addTraffic(
        i,
        c % 3,
        lanes[c % lanes.length],
        paces[c % paces.length],
        0.45 + (c % 5) * 0.12,
        amp,
        c * 1.7
      );
    }
  }

  function settleCar(car) {
    let z = car.z;
    if (z < 0) z = 0;
    if (z >= trackLength) z = trackLength - 1;
    const i = Math.floor(z / SEG);
    const seg = segments[i];
    if (!seg) return;
    const t = z / SEG - i;
    car.t = t;
    car.y = seg.p1.world.y + (seg.p2.world.y - seg.p1.world.y) * t;
  }

  function separateTraffic() {
    const live = [];
    for (let i = 0; i < traffic.length; i++) {
      if (!traffic[i].gone) live.push(traffic[i]);
    }
    live.sort(function (a, b) { return b.z - a.z; });
    for (let i = 1; i < live.length; i++) {
      const maxZ = live[i - 1].z - CAR_GAP;
      if (live[i].z > maxZ) live[i].z = maxZ;
    }
  }

  function updateTraffic(dt) {
    const limit = 1 - CAR_HALF - 0.04;
    for (let i = 0; i < traffic.length; i++) {
      const car = traffic[i];
      if (car.gone) continue;
      car.z += car.speed * dt;
      if (car.z >= trackLength) {
        car.gone = true;
        continue;
      }
      car.phase += car.weave * dt;
      car.offset = clamp(car.lane + Math.sin(car.phase) * car.amp, -limit, limit);
    }
    separateTraffic();
    for (let i = 0; i < traffic.length; i++) {
      if (!traffic[i].gone) settleCar(traffic[i]);
    }
  }

  function resetTraffic() {
    const limit = 1 - CAR_HALF - 0.04;
    for (let i = 0; i < traffic.length; i++) {
      const car = traffic[i];
      car.z = car.homeZ;
      car.phase = car.phase0;
      car.offset = clamp(car.lane + Math.sin(car.phase) * car.amp, -limit, limit);
      car.gone = false;
      car.prevZ = car.z;
      car.prevOffset = car.offset;
      settleCar(car);
    }
  }

  function sweepHits(x0, z0, x1, z1, hx, zLo, zHi) {
    let t0 = 0;
    let t1 = 1;
    function clip(p, d, lo, hi) {
      if (Math.abs(d) < 1e-9) return p >= lo && p <= hi;
      let a = (lo - p) / d;
      let b = (hi - p) / d;
      if (a > b) {
        const s = a;
        a = b;
        b = s;
      }
      if (a > t0) t0 = a;
      if (b < t1) t1 = b;
      return t0 <= t1;
    }
    return clip(x0, x1 - x0, -hx, hx) && clip(z0, z1 - z0, zLo, zHi) && t1 >= 0 && t0 <= 1;
  }

  function resolveTraffic() {
    const nose = position + playerZ;
    const nose0 = prevPosition + playerZ;
    const laneScale = ROAD_W / ROAD_DRAW_W;
    const hx = CAR_HALF * (1 + laneScale);
    const zLo = -SEG * 1.25;
    const zHi = SEG * 1.5;
    const holdGap = SEG * 0.4;
    const maxStep = maxSpeed / 60 + 2;
    let hit = false;
    for (let i = 0; i < traffic.length; i++) {
      const car = traffic[i];
      if (car.gone) continue;
      const x0 = prevPlayerX - car.prevOffset * laneScale;
      const x1 = playerX - car.offset * laneScale;
      const z0 = car.prevZ - nose0;
      const z1 = car.z - nose;
      const jumped = Math.abs(car.z - car.prevZ) > maxStep;
      const struck = jumped
        ? (Math.abs(x1) <= hx && z1 >= zLo && z1 <= zHi) ||
          (Math.abs(x0) <= hx && z0 >= zLo && z0 <= zHi)
        : sweepHits(x0, z0, x1, z1, hx, zLo, zHi);
      if (!struck) continue;
      hit = true;
      const crawl = maxSpeed * 0.04;
      if (speed > crawl) speed = crawl;
      recover = 4.5;
      if (z1 < holdGap) {
        const holdPos = car.z - playerZ - holdGap;
        if (position > holdPos) position = holdPos > 0 ? holdPos : 0;
      }
    }
    if (hit && !bumping) playBump();
    bumping = hit;
    prevPosition = position;
    prevPlayerX = playerX;
    for (let i = 0; i < traffic.length; i++) {
      const car = traffic[i];
      car.prevZ = car.z;
      car.prevOffset = car.offset;
    }
  }

  function findSegment(z) {
    const n = segments.length;
    let i = Math.floor(z / SEG) % n;
    if (i < 0) i += n;
    return segments[i];
  }

  function segPercent(z) {
    let m = z % SEG;
    if (m < 0) m += SEG;
    return m / SEG;
  }

  function project(p, camX, camY, camZ) {
    p.camera.x = -camX;
    p.camera.y = p.world.y - camY;
    p.camera.z = p.world.z - camZ;
    if (p.camera.z <= 0.1) {
      p.screen.scale = 0;
      p.screen.x = viewW / 2;
      p.screen.y = viewH + 4000;
      p.screen.w = 0;
      return;
    }
    const scale = camDepth / p.camera.z;
    p.screen.scale = scale;
    p.screen.x = Math.round(viewW / 2 + scale * p.camera.x * viewW / 2);
    p.screen.y = Math.round(viewH * HORIZON - scale * p.camera.y * viewH / 2);
    p.screen.w = Math.round(scale * ROAD_DRAW_W * viewW / 2);
  }

  function quad(x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
  }

  function blendT(z) {
    if (stage < 2) return 0;
    const u = clamp(z / GRASS_BLEND, 0, 1);
    return u * u * (3 - 2 * u);
  }

  function grassFade() {
    if (stage < 2) return 0;
    const u = clamp(grassAge / 5, 0, 1);
    return u * u * (3 - 2 * u);
  }

  function grassColor(dark, t) {
    const pair = dark ? GRASS_RGB.dark : GRASS_RGB.light;
    const i = stage >= 3 ? 1 : 0;
    const a = pair[i];
    const b = pair[i + 1];
    if (stage < 2 || t <= 0) return "rgb(" + a[0] + "," + a[1] + "," + a[2] + ")";
    if (t >= 1) return "rgb(" + b[0] + "," + b[1] + "," + b[2] + ")";
    return "rgb(" +
      Math.round(a[0] + (b[0] - a[0]) * t) + "," +
      Math.round(a[1] + (b[1] - a[1]) * t) + "," +
      Math.round(a[2] + (b[2] - a[2]) * t) + ")";
  }

  function shadeRoad(dark, grade) {
    const base = dark ? ROAD_RGB.dark : ROAD_RGB.light;
    const g = clamp(grade / 0.22, -1, 1);
    let r, gc, b;
    if (g >= 0) {
      const k = g * 0.72;
      r = base[0] * (1 - k);
      gc = base[1] * (1 - k * 0.8);
      b = base[2] * (1 - k * 0.52);
    } else {
      const k = -g * 0.64;
      r = base[0] + (250 - base[0]) * k;
      gc = base[1] + (236 - base[1]) * k;
      b = base[2] + (208 - base[2]) * k;
    }
    return "rgb(" + (r + 0.5 | 0) + "," + (gc + 0.5 | 0) + "," + (b + 0.5 | 0) + ")";
  }

  function drawSeg(s) {
    const x1 = s.x1, y1 = s.y1, w1 = s.w1;
    const x2 = s.x2, y2 = s.y2, w2 = s.w2;
    const r1 = w1 / 5;
    const r2 = w2 / 5;
    const ol1 = x1 - w1 - r1;
    const or1 = x1 + w1 + r1;
    const ol2 = x2 - w2 - r2;
    const or2 = x2 + w2 + r2;

    quad(0, y1, ol1, y1, ol2, y2, 0, y2, s.grass);
    quad(or1, y1, viewW, y1, viewW, y2, or2, y2, s.grass);
    quad(ol1, y1, x1 - w1, y1, x2 - w2, y2, ol2, y2, s.rumble);
    quad(or1, y1, x1 + w1, y1, x2 + w2, y2, or2, y2, s.rumble);
    quad(x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, s.road);
    if (s.lane) {
      const h1 = w1 / 36;
      const h2 = w2 / 36;
      quad(x1 - h1, y1, x1 + h1, y1, x2 + h2, y2, x2 - h2, y2, s.lane);
    }
  }

  function drawFinish(s) {
    const yA = s.y1;
    const yB = s.y2;
    const xAl = s.x1 - s.w1;
    const xAr = s.x1 + s.w1;
    const xBl = s.x2 - s.w2;
    const xBr = s.x2 + s.w2;
    const cols = 8;
    for (let i = 0; i < cols; i++) {
      const u0 = i / cols;
      const u1 = (i + 1) / cols;
      quad(
        xAl + (xAr - xAl) * u0, yA,
        xAl + (xAr - xAl) * u1, yA,
        xBl + (xBr - xBl) * u1, yB,
        xBl + (xBr - xBl) * u0, yB,
        (i + s.band) % 2 ? "#fffef8" : "#101114"
      );
    }
  }

  function drawGate(g) {
    const w = g.w;
    const x = g.x;
    const y = g.y;
    const half = w * 1.36;
    const postW = Math.max(2, w * 0.12);
    const postH = w * 2.7;
    const bh = w * 0.58;
    const top = y - postH;
    const bx = x - half - postW * 0.5;
    const bw = half * 2 + postW;
    ctx.fillStyle = "#241c14";
    ctx.fillRect(bx, top, postW, postH);
    ctx.fillRect(bx + bw - postW, top, postW, postH);
    ctx.fillStyle = "#ffe14a";
    ctx.fillRect(bx, top, bw, bh);
    ctx.strokeStyle = "#1a0708";
    ctx.lineWidth = Math.max(2, bh * 0.08);
    ctx.strokeRect(bx, top, bw, bh);
    ctx.fillStyle = "#1a0708";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const label = g.label;
    let fs = Math.round(bh * 0.58);
    ctx.font = "italic " + fs + "px Impact, 'Arial Black', sans-serif";
    while (fs > 8 && ctx.measureText(label).width > bw * 0.9) {
      fs -= 1;
      ctx.font = "italic " + fs + "px Impact, 'Arial Black', sans-serif";
    }
    ctx.fillText(label, x, top + bh * 0.52);
  }

  function projectSpriteY(worldY, cz, camY) {
    if (cz <= 0.1) return 1e9;
    return viewH * HORIZON - (camDepth / cz) * (worldY - camY) * viewH / 2;
  }

  function queueSprite(sp, camX, dx, camY, camZ, clipY, lineU, hidden) {
    if (sp.stamp === spriteStamp) return null;
    sp.stamp = spriteStamp;
    const cz = sp.z - camZ;
    if (!(cz > 0.25)) return null;
    const scale = camDepth / cz;
    const sw = scale * ROAD_W * viewW / 2;
    const cx = -(camX - sp.t * dx);
    const roadX = viewW / 2 + scale * cx * viewW / 2;
    sp.roadX = roadX;
    sp.roadW = sw;
    sp.sx = roadX + sp.offset * sw;
    sp.sy = projectSpriteY(sp.y, cz, camY);
    sp.sk = sw;
    sp.cz = cz;
    sp.clipY = clipY;
    sp.lineU = lineU;
    sp.hidden = hidden;
    return sp;
  }

  function drawRoadside(sp) {
    if (sp.hidden) return;
    const clipBottom = (sp.clipY < sp.lineU ? sp.clipY : sp.lineU) - 1;
    if (!(clipBottom > 1)) return;
    const leftKeep = sp.roadX - sp.roadW - 1;
    const rightKeep = sp.roadX + sp.roadW + 1;
    ctx.save();
    ctx.beginPath();
    if (leftKeep > 0) ctx.rect(0, 0, leftKeep < viewW ? leftKeep : viewW, clipBottom);
    if (rightKeep < viewW) {
      const x0 = rightKeep > 0 ? rightKeep : 0;
      ctx.rect(x0, 0, viewW - x0, clipBottom);
    }
    ctx.clip();
    ctx.translate(sp.sx, sp.sy);
    const k = sp.sk;
    if (sp.kind === "sign") drawSprite(SPRITES.sign, k * 0.74, true);
    else drawSprite(SPRITES.billboard, k * 0.86, true);
    ctx.restore();
  }

  function queueCar(car, camX, dx, camY, camZ, clipY, lineU, hidden) {
    if (car.stamp === spriteStamp) return null;
    car.stamp = spriteStamp;
    const z = car.z >= trackLength ? trackLength - 1 : car.z;
    const cz = z - camZ;
    if (!(cz > 0.05)) return null;
    const scale = camDepth / cz;
    const sw = scale * ROAD_W * viewW / 2;
    const cx = -(camX - car.t * dx);
    const roadX = viewW / 2 + scale * cx * viewW / 2;
    car.roadX = roadX;
    car.roadW = sw;
    car.sx = roadX + car.offset * sw;
    car.sy = viewH * HORIZON - scale * (car.y - camY) * viewH / 2;
    car.sk = sw;
    car.cz = cz;
    car.clipY = clipY;
    car.lineU = lineU;
    car.hidden = hidden;
    return car;
  }

  function paintQueued(sp) {
    if (sp.kind === "car") drawTrafficCar(sp);
    else drawRoadside(sp);
  }

  function drawTrafficCar(sp) {
    if (!(sp.cz > 0.05)) return;
    const near = sp.cz < SEG * 48;
    if (sp.hidden && !near) return;
    const clipBottom = (sp.clipY < sp.lineU ? sp.clipY : sp.lineU) - 1;
    ctx.save();
    if (!near && clipBottom > 1) {
      ctx.beginPath();
      ctx.rect(0, 0, viewW, clipBottom);
      ctx.clip();
    }
    ctx.translate(sp.sx, sp.sy);
    drawSprite(SPRITES.cars[sp.variant % 3], sp.sk * 0.35 * 0.48, false);
    ctx.restore();
  }

  function drawSprite(sp, size, byHeight) {
    const img = sp.img;
    if (!img || (img instanceof HTMLImageElement && !img.complete)) return;
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    if (!iw || !ih) return;
    const dw = byHeight ? size * iw / sp.h : size * iw / sp.w;
    const dh = dw * ih / iw;
    ctx.drawImage(
      img,
      -dw * (sp.x + sp.w / 2) / iw,
      -dh * (sp.y + sp.h) / ih,
      dw,
      dh
    );
  }

  function drawCar() {
    const off = Math.abs(playerX) > 1;
    const sp = speed / maxSpeed;
    const bob = off ? Math.sin(position * 0.045) * 3.2 * sp : 0;
    const sc = Math.min(viewW * 0.14, viewH * 0.3) / 160 * 1.4;
    const lean = wheel;

    ctx.save();
    ctx.translate(viewW / 2 + lean * 24, viewH - 2 + bob);
    ctx.rotate(lean * 0.07);
    ctx.scale(sc, sc * (1 - clamp(hillGrade, -0.3, 0.3) * 0.18));
    drawSprite(SPRITES.player, 156, false);
    ctx.restore();
  }

  function drawHud() {
    const kmh = Math.max(0, Math.round(speed / maxSpeed * 280));
    const u = clamp(Math.min(viewW / 1280, viewH / 820), 0.55, 1.4);
    const x = viewW - 26 * u;
    const y = viewH - 34 * u;
    const off = Math.abs(playerX) > 1;

    ctx.textAlign = "right";
    ctx.textBaseline = "alphabetic";
    ctx.lineJoin = "round";
    ctx.font = "italic " + Math.round(86 * u) + "px Impact, 'Arial Black', sans-serif";
    ctx.lineWidth = 8 * u;
    ctx.strokeStyle = "#1a0708";
    ctx.strokeText(String(kmh), x, y);
    ctx.fillStyle = off ? "#ff4a38" : "#ffe14a";
    ctx.fillText(String(kmh), x, y);

    ctx.font = "italic " + Math.round(22 * u) + "px Impact, 'Arial Black', sans-serif";
    ctx.lineWidth = 4 * u;
    ctx.strokeText("KM/H", x, y + 24 * u);
    ctx.fillStyle = "#ffb03a";
    ctx.fillText("KM/H", x, y + 24 * u);

    const timeHot = phase === "fail" || (phase === "race" && timeLeft <= 10);
    const timeStr = Math.max(0, timeLeft).toFixed(1).replace(".", ",");
    ctx.font = Math.round(22 * u) + "px Impact, 'Arial Black', sans-serif";
    ctx.lineWidth = 4 * u;
    ctx.strokeText("TID", x, 36 * u);
    ctx.fillStyle = "#ffb03a";
    ctx.fillText("TID", x, 36 * u);
    ctx.font = "italic " + Math.round(72 * u) + "px Impact, 'Arial Black', sans-serif";
    ctx.lineWidth = 8 * u;
    ctx.strokeText(timeStr, x, 108 * u);
    ctx.fillStyle = timeHot ? "#ff4a38" : "#ffe14a";
    ctx.fillText(timeStr, x, 108 * u);

    ctx.textAlign = "left";
    ctx.font = Math.round(18 * u) + "px Impact, 'Arial Black', sans-serif";
    ctx.lineWidth = 4 * u;
    const hint = "SPACE START      ← →  /  A D      OP GAS      NED BREMSE      R GENSTART";
    ctx.strokeStyle = "#1a0708";
    ctx.strokeText(hint, 20 * u, 34 * u);
    ctx.fillStyle = "#fff1c9";
    ctx.fillText(hint, 20 * u, 34 * u);
  }

  function drawBanner() {
    let title = "";
    let sub = "";
    if (phase === "ready") {
      title = "TRYK SPACE";
      sub = "NÅ MÅL FØR TIDEN";
    } else if (phase === "count") {
      title = String(Math.max(1, Math.ceil(countLeft)));
    } else if (phase === "goal") {
      title = "FINISH";
      sub = "R GENSTARTER";
    } else if (phase === "fail") {
      title = "TIDEN ER UDE";
      sub = "R GENSTARTER";
    } else {
      return;
    }

    const u = clamp(Math.min(viewW / 1280, viewH / 820), 0.55, 1.4);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#1a0708";
    let size = Math.round((phase === "count" ? 160 : 96) * u);
    ctx.font = "italic " + size + "px Impact, 'Arial Black', sans-serif";
    const maxW = viewW * 0.88;
    while (size > 28 && ctx.measureText(title).width > maxW) {
      size -= 4;
      ctx.font = "italic " + size + "px Impact, 'Arial Black', sans-serif";
    }
    ctx.lineWidth = Math.max(4, size * 0.08);
    const y = viewH * 0.36;
    ctx.strokeText(title, viewW / 2, y);
    ctx.fillStyle = phase === "fail" ? "#ff4a38" : "#ffe14a";
    ctx.fillText(title, viewW / 2, y);
    if (!sub) return;
    ctx.font = Math.round(28 * u) + "px Impact, 'Arial Black', sans-serif";
    ctx.lineWidth = 5 * u;
    ctx.strokeText(sub, viewW / 2, y + 72 * u);
    ctx.fillStyle = "#fff1c9";
    ctx.fillText(sub, viewW / 2, y + 72 * u);
  }

  function update(dt) {
    if (phase === "count") {
      countLeft -= dt;
      if (countLeft <= 0) {
        countLeft = 0;
        phase = "race";
      }
      return;
    }
    if (phase !== "race") return;

    if (stage >= 2 && grassAge < 5) grassAge += dt;

    updateTraffic(dt);

    const seg = findSegment(position + playerZ);
    const sp = speed / maxSpeed;
    const dx = dt * 2 * sp;
    const steer = dt * 2 * Math.max(sp, 0.2);
    const left = held.ArrowLeft || held.a;
    const right = held.ArrowRight || held.d;
    const gas = held.ArrowUp || held.w;
    const brake = held.ArrowDown || held.s;

    position += dt * speed;
    horizonScroll += dt * speed * horizonCurve() * HORIZON_K;
    if (position >= trackLength) {
      if (stage < 2) {
        enterLevel2();
        return;
      }
      if (stage < 3) {
        enterLevel3();
        return;
      }
      position = 0;
      speed = 0;
      phase = "goal";
      return;
    }

    if (left) playerX -= steer;
    else if (right) playerX += steer;
    playerX -= dx * sp * seg.curve * CENTRIFUGAL;

    const target = (right ? 1 : 0) - (left ? 1 : 0);
    wheel += (target - wheel) * Math.min(1, dt * 10);

    hillGrade = (seg.p2.world.y - seg.p1.world.y) / SEG;
    let cap = maxSpeed;
    if (hillGrade > 0) cap = maxSpeed / (1 + hillGrade * 2.2);
    else cap = maxSpeed * (1 + Math.min(0.14, -hillGrade * 0.4));

    const climb = recover > 0 ? 0.2 : 1;
    if (recover > 0) recover -= dt;
    if (gas) speed += accel * climb * dt;
    else if (brake) speed += braking * dt;
    else speed += decel * dt;

    const off = Math.abs(playerX) > 1;
    if (off && speed > offRoadLimit) speed += offRoadDecel * dt;
    if (hillGrade < 0 && !brake && !off && recover <= 0) speed += (-hillGrade) * maxSpeed * 0.4 * dt;
    if (speed > cap) speed = Math.max(cap, speed - maxSpeed * 0.75 * dt);

    playerX = clamp(playerX, -2, 2);
    if (speed < 0) speed = 0;
    resolveTraffic();

    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      speed = 0;
      phase = "fail";
    }
  }

  function drawTitleSprite(sp, cx, footY, maxW, maxH) {
    const img = sp.img;
    if (!img || (img instanceof HTMLImageElement && !img.complete)) return;
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    if (!iw || !ih) return;
    let dh = maxH;
    let dw = dh * sp.w / sp.h;
    if (dw > maxW) {
      dw = maxW;
      dh = dw * sp.h / sp.w;
    }
    ctx.drawImage(img, sp.x, sp.y, sp.w, sp.h, cx - dw / 2, footY - dh, dw, dh);
  }

  function drawTitle() {
    const sky = ctx.createLinearGradient(0, 0, 0, viewH);
    sky.addColorStop(0, "rgb(214,248,255)");
    sky.addColorStop(0.28, "rgb(46,168,236)");
    sky.addColorStop(0.62, "rgb(14,72,176)");
    sky.addColorStop(1, "rgb(6,20,72)");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, viewW, viewH);

    const footY = viewH * 0.74;
    ctx.fillStyle = "#12962c";
    ctx.fillRect(0, footY, viewW, viewH - footY);
    ctx.fillStyle = "#22c240";
    ctx.fillRect(0, footY, viewW, Math.max(6, viewH * 0.018));

    const padW = Math.min(viewW * 0.92, viewW - 24);
    const padH = Math.max(18, viewH * 0.045);
    const padX = (viewW - padW) / 2;
    const padY = footY - padH * 0.35;
    ctx.fillStyle = "#555a68";
    ctx.fillRect(padX, padY, padW, padH);
    ctx.fillStyle = "#848894";
    ctx.fillRect(padX, padY, padW, Math.max(3, padH * 0.22));

    const u = clamp(Math.min(viewW / 1280, viewH / 820), 0.55, 1.4);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#1a0708";

    const title = "OUTRUN";
    let size = Math.round(96 * u);
    ctx.font = "italic " + size + "px Impact, 'Arial Black', sans-serif";
    const maxText = viewW * 0.88;
    while (size > 32 && ctx.measureText(title).width > maxText) {
      size -= 4;
      ctx.font = "italic " + size + "px Impact, 'Arial Black', sans-serif";
    }
    ctx.lineWidth = Math.max(4, size * 0.08);
    const titleY = viewH * 0.15;
    ctx.strokeText(title, viewW / 2, titleY);
    ctx.fillStyle = "#ffe14a";
    ctx.fillText(title, viewW / 2, titleY);

    const cars = [SPRITES.player, SPRITES.cars[0], SPRITES.cars[1], SPRITES.cars[2]];
    const slot = viewW / cars.length;
    const maxH = Math.max(120, footY - titleY - 40 * u);
    const maxW = slot * 0.84;
    for (let i = 0; i < cars.length; i++) {
      drawTitleSprite(cars[i], slot * (i + 0.5), footY, maxW, maxH);
    }

    const prompt = "Space for at starte";
    let ps = Math.round(34 * u);
    ctx.font = ps + "px Impact, 'Arial Black', sans-serif";
    while (ps > 16 && ctx.measureText(prompt).width > maxText) {
      ps -= 2;
      ctx.font = ps + "px Impact, 'Arial Black', sans-serif";
    }
    ctx.lineWidth = Math.max(3, 5 * u);
    const py = footY + (viewH - footY) * 0.52;
    ctx.strokeText(prompt, viewW / 2, py);
    ctx.fillStyle = "#fff1c9";
    ctx.fillText(prompt, viewW / 2, py);
  }

  function render() {
    if (phase === "title") {
      drawTitle();
      return;
    }
    const base = findSegment(position);
    const basePercent = segPercent(position);
    const playerSeg = findSegment(position + playerZ);
    const playerPercent = segPercent(position + playerZ);
    const playerY = lerp(playerSeg.p1.world.y, playerSeg.p2.world.y, playerPercent);
    const nSeg = segments.length;

    drawSky();

    let maxY = viewH;
    let lineU = viewH;
    let x = 0;
    let dx = -(base.curve * basePercent) * CURVE_SCALE;
    const layers = [];
    let sawRoad = false;
    spriteStamp++;
    const carBucket = new Array(nSeg);
    for (let c = 0; c < traffic.length; c++) {
      const car = traffic[c];
      if (car.gone) continue;
      const z = car.z >= trackLength ? trackLength - 1 : car.z;
      const idx = Math.floor(z / SEG);
      if (idx < 0 || idx >= nSeg) continue;
      if (!carBucket[idx]) carBucket[idx] = [];
      carBucket[idx].push(car);
    }

    for (let n = 0; n < DRAW; n++) {
      const seg = segments[(base.index + n) % nSeg];
      const looped = seg.index < base.index;
      const camZ = position - (looped ? trackLength : 0);
      const camX = playerX * ROAD_DRAW_W - x;
      const camY = playerY + CAM_H;

      project(seg.p1, camX, camY, camZ);
      project(seg.p2, camX - dx, camY, camZ);
      let gateHere = null;
      if (!looped && seg.index === nSeg - 1 && seg.p2.camera.z > 1 && seg.p2.screen.w > 1) {
        gateHere = {
          x: seg.p2.screen.x,
          y: seg.p2.screen.y,
          w: seg.p2.screen.w,
          cz: seg.p2.camera.z,
          label: stage < 2 ? "LEVEL 2" : (stage < 3 ? "LEVEL 3" : "FINISH")
        };
      }

      const y1u = projectSpriteY(seg.p1.world.y, seg.p1.world.z - camZ, camY);
      const y2u = projectSpriteY(seg.p2.world.y, seg.p2.world.z - camZ, camY);
      if (seg.p1.camera.z <= camDepth) seg.spriteHide = false;
      else if (y2u >= lineU + 2 || y2u >= y1u + 2) seg.spriteHide = true;
      else if (y2u < lineU - 2 && y2u < y1u - 2) seg.spriteHide = false;

      const sprites = [];
      if (seg.sprites) {
        const list = seg.sprites;
        for (let s = 0; s < list.length; s++) {
          const queued = queueSprite(list[s], camX, dx, camY, camZ, maxY, lineU, seg.spriteHide === true);
          if (queued) sprites.push(queued);
        }
      }
      const mine = !looped && carBucket[seg.index];
      if (mine) {
        for (let c = 0; c < mine.length; c++) {
          const car = mine[c];
          const hide = seg.spriteHide === true && (car.z - camZ) > SEG * 48;
          const queued = queueCar(car, camX, dx, camY, camZ, maxY, lineU, hide);
          if (queued) sprites.push(queued);
        }
      }

      x += dx;
      dx += seg.curve * CURVE_SCALE;

      let span = null;
      if (!(seg.p1.camera.z <= camDepth ||
            seg.p2.screen.y >= seg.p1.screen.y ||
            seg.p2.screen.y >= maxY)) {
        const col = seg.dark ? PAL.dark : PAL.light;
        const grade = (seg.p2.world.y - seg.p1.world.y) / SEG;
        span = {
          grass: grassColor(seg.dark, grassFade()),
          rumble: col.rumble,
          lane: col.lane,
          road: shadeRoad(seg.dark, grade),
          x1: seg.p1.screen.x,
          y1: seg.p1.screen.y,
          w1: seg.p1.screen.w,
          x2: seg.p2.screen.x,
          y2: seg.p2.screen.y,
          w2: seg.p2.screen.w,
          finish: !looped && seg.index >= nSeg - 4,
          band: seg.index
        };
        maxY = seg.p2.screen.y;
        lineU = y2u;
        sawRoad = true;
      }

      if (span || sprites.length || gateHere) layers.push({ span: span, sprites: sprites, gate: gateHere });
    }

    drawHorizon(sawRoad ? maxY : viewH * HORIZON);

    for (let i = layers.length - 1; i >= 0; i--) {
      const layer = layers[i];
      if (layer.span) {
        drawSeg(layer.span);
        if (layer.span.finish) drawFinish(layer.span);
      }
      const list = layer.sprites;
      const gz = layer.gate ? layer.gate.cz : null;
      if (gz !== null) {
        for (let s = 0; s < list.length; s++) {
          if (list[s].cz > gz) paintQueued(list[s]);
        }
        drawGate(layer.gate);
      }
      for (let s = 0; s < list.length; s++) {
        if (gz !== null && list[s].cz > gz) continue;
        paintQueued(list[s]);
      }
    }

    drawCar();
    drawHud();
    drawBanner();
  }

  function horizonCurve() {
    const base = findSegment(position);
    const nSeg = segments.length;
    let sum = 0;
    let wsum = 0;
    for (let i = 0; i < HORIZON_AHEAD; i++) {
      const w = HORIZON_AHEAD - i;
      sum += segments[(base.index + i) % nSeg].curve * w;
      wsum += w;
    }
    return sum / wsum;
  }

  function ridgeScreen(pts, shift, period) {
    const out = [];
    const i0 = -1;
    const i1 = Math.ceil(viewW / period) + 1;
    for (let tile = i0; tile <= i1; tile++) {
      const x0 = tile * period - shift;
      for (let p = 0; p < pts.length; p++) {
        out.push({ x: x0 + pts[p][0] * period, h: pts[p][1] });
      }
    }
    return out;
  }

  function ridgeBulge(i) {
    const k = [0.45, 0.95, 0.3, 1.1, 0.6, 0.8][i % 6];
    return viewH * 0.0055 * k;
  }

  function ridgeSeg(prev, cur, i, base) {
    const y0 = base - prev.h * viewH;
    const y1 = base - cur.h * viewH;
    return {
      p0: { x: prev.x, y: y0 },
      p1: { x: cur.x, y: y1 },
      c: { x: (prev.x + cur.x) * 0.5, y: (y0 + y1) * 0.5 - ridgeBulge(i) }
    };
  }

  function fillRidge(sp, base, color) {
    if (sp.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(sp[0].x, base);
    ctx.lineTo(sp[0].x, base - sp[0].h * viewH);
    for (let i = 1; i < sp.length; i++) {
      const seg = ridgeSeg(sp[i - 1], sp[i], i, base);
      ctx.quadraticCurveTo(seg.c.x, seg.c.y, seg.p1.x, seg.p1.y);
    }
    ctx.lineTo(sp[sp.length - 1].x, base);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function lerpPt(a, b, t) {
    return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
  }

  function splitQuad(p0, c, p1, t) {
    const a = lerpPt(p0, c, t);
    const b = lerpPt(c, p1, t);
    const p = lerpPt(a, b, t);
    return { left: [p0, a, p], right: [p, b, p1] };
  }

  function fillLit(sp, base, color) {
    ctx.beginPath();
    for (let i = 1; i < sp.length - 1; i++) {
      const h = sp[i].h;
      if (h < 0.04 || h <= sp[i - 1].h || h < sp[i + 1].h) continue;
      if (h - sp[i + 1].h < 0.006) continue;
      const seg = ridgeSeg(sp[i], sp[i + 1], i + 1, base);
      const yb0 = Math.min(base, seg.p0.y + (base - seg.p0.y) * 0.34);
      const yb1 = Math.min(base, seg.p1.y + (base - seg.p1.y) * 0.42);
      const mx = (seg.p0.x + seg.p1.x) * 0.5;
      const my = Math.min(base, (yb0 + yb1) * 0.5 + viewH * 0.004);
      ctx.moveTo(seg.p0.x, seg.p0.y);
      ctx.quadraticCurveTo(seg.c.x, seg.c.y, seg.p1.x, seg.p1.y);
      ctx.lineTo(seg.p1.x, yb1);
      ctx.quadraticCurveTo(mx, my, seg.p0.x, yb0);
      ctx.closePath();
    }
    ctx.fillStyle = color;
    ctx.fill();
  }

  function fillCaps(sp, base, color) {
    ctx.beginPath();
    for (let i = 1; i < sp.length - 1; i++) {
      const h = sp[i].h;
      if (h < 0.048 || h <= sp[i - 1].h || h <= sp[i + 1].h) continue;
      const left = splitQuad(
        ridgeSeg(sp[i - 1], sp[i], i, base).p0,
        ridgeSeg(sp[i - 1], sp[i], i, base).c,
        ridgeSeg(sp[i - 1], sp[i], i, base).p1,
        0.48
      ).right;
      const right = splitQuad(
        ridgeSeg(sp[i], sp[i + 1], i + 1, base).p0,
        ridgeSeg(sp[i], sp[i + 1], i + 1, base).c,
        ridgeSeg(sp[i], sp[i + 1], i + 1, base).p1,
        0.52
      ).left;
      const drop = Math.min(viewH * 0.011, (base - left[2].y) * 0.28);
      const yL = Math.min(base, left[0].y + drop * 0.55);
      const yR = Math.min(base, right[2].y + drop * 0.8);
      const yN = Math.min(base, left[2].y + drop);
      ctx.moveTo(left[0].x, left[0].y);
      ctx.quadraticCurveTo(left[1].x, left[1].y, left[2].x, left[2].y);
      ctx.quadraticCurveTo(right[1].x, right[1].y, right[2].x, right[2].y);
      ctx.lineTo(right[2].x, yR);
      ctx.quadraticCurveTo((left[0].x + right[2].x) * 0.5, yN, left[0].x, yL);
      ctx.closePath();
    }
    ctx.fillStyle = color;
    ctx.fill();
  }

  function drawHorizon(base) {
    const s = viewW / 1280;
    const period = 1600 * s;
    function wrapShift(mul) {
      let shift = (horizonScroll * s * mul) % period;
      if (shift < 0) shift += period;
      return shift;
    }
    const far = ridgeScreen(RIDGE_FAR, wrapShift(1), period);
    const mid = ridgeScreen(RIDGE_MID, wrapShift(HILL_FRONT), period);
    fillRidge(far, base, HILL_FAR);
    fillLit(far, base, HILL_LIT);
    fillCaps(far, base, HILL_LIT);
    fillRidge(mid, base, HILL_MID);
    fillLit(mid, base, HILL_LIT);
    fillCaps(mid, base, HILL_LIT);
  }

  function mixStops(a, b, t) {
    const out = new Array(a.length);
    for (let i = 0; i < a.length; i++) {
      out[i] = [
        a[i][0] + (b[i][0] - a[i][0]) * t,
        a[i][1] + (b[i][1] - a[i][1]) * t,
        a[i][2] + (b[i][2] - a[i][2]) * t
      ];
    }
    return out;
  }

  function rasterBands(stops) {
    const steps = SKY_BANDS.length;
    const bands = new Array(steps);
    const span = stops.length - 1;
    for (let i = 0; i < steps; i++) {
      const u = i / (steps - 1) * span;
      const ia = Math.floor(u);
      const ib = Math.min(span, ia + 1);
      const t = u - ia;
      const a = stops[ia];
      const b = stops[ib];
      bands[i] = "rgb(" +
        Math.round(a[0] + (b[0] - a[0]) * t) + "," +
        Math.round(a[1] + (b[1] - a[1]) * t) + "," +
        Math.round(a[2] + (b[2] - a[2]) * t) + ")";
    }
    return bands;
  }

  function skyBandsNow() {
    if (stage < 2) return SKY_BANDS;
    const t = blendT(position);
    if (stage < 3) {
      if (t >= 1) return rasterBands(SKY_GRAY);
      if (t <= 0) return SKY_BANDS;
      return rasterBands(mixStops(SKY_STOPS, SKY_GRAY, t));
    }
    if (t >= 1) return rasterBands(SKY_DUSK);
    if (t <= 0) return rasterBands(SKY_GRAY);
    return rasterBands(mixStops(SKY_GRAY, SKY_DUSK, t));
  }

  function drawSky() {
    const bands = skyBandsNow();
    const n = bands.length;
    const skyH = Math.max(1, Math.round(viewH * HORIZON));
    const bandH = 3;
    const rows = Math.ceil(skyH / bandH);
    let y = 0;
    for (let i = 0; i < rows; i++) {
      const idx = Math.round((rows === 1 ? 1 : i / (rows - 1)) * (n - 1));
      ctx.fillStyle = bands[idx];
      const h = Math.min(bandH, skyH - y);
      ctx.fillRect(0, y, viewW, h);
      y += h;
    }
    ctx.fillStyle = bands[n - 1];
    if (y < viewH) ctx.fillRect(0, y, viewW, viewH - y);
  }

  function resetRun() {
    position = 0;
    speed = 0;
    recover = 0;
    playerX = 0;
    prevPosition = 0;
    prevPlayerX = 0;
    wheel = 0;
    hillGrade = 0;
    horizonScroll = 0;
    timeLeft = RACE_SECS;
    countLeft = 0;
    resetTraffic();
  }

  function restart() {
    resetRun();
    phase = "ready";
  }

  function enterLevel2() {
    const keepSpeed = speed;
    const keepX = playerX;
    const keepWheel = wheel;
    const keepRecover = recover;
    stage = 2;
    grassAge = 0;
    buildCourse(2);
    position = 0;
    prevPosition = 0;
    prevPlayerX = keepX;
    playerX = keepX;
    speed = keepSpeed;
    wheel = keepWheel;
    recover = keepRecover;
    timeLeft = RACE_SECS;
    phase = "race";
    playFanfare();
  }

  function enterLevel3() {
    const keepSpeed = speed;
    const keepX = playerX;
    const keepWheel = wheel;
    const keepRecover = recover;
    stage = 3;
    grassAge = 0;
    buildCourse(3);
    position = 0;
    prevPosition = 0;
    prevPlayerX = keepX;
    playerX = keepX;
    speed = keepSpeed;
    wheel = keepWheel;
    recover = keepRecover;
    timeLeft = RACE_SECS;
    phase = "race";
    playFanfare();
  }

  function showTitle() {
    stage = 1;
    buildCourse(1);
    resetRun();
    phase = "title";
  }

  function beginCountdown() {
    resetRun();
    countLeft = COUNT_SECS;
    phase = "count";
  }

  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    viewW = Math.max(2, window.innerWidth);
    viewH = Math.max(2, window.innerHeight);
    canvas.width = Math.floor(viewW * dpr);
    canvas.height = Math.floor(viewH * dpr);
    canvas.style.left = "0";
    canvas.style.top = "0";
    canvas.style.width = viewW + "px";
    canvas.style.height = viewH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function toggleFullscreen() {
    const active = document.fullscreenElement || document.webkitFullscreenElement;
    if (!active) {
      const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
      if (req) req.call(document.documentElement);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    }
  }

  function enterFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return;
    const pending = req.call(el);
    if (pending && pending.catch) pending.catch(function () {});
  }

  function normKey(k) {
    return k.length === 1 ? k.toLowerCase() : k;
  }

  function ensureAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) {
      audioCtx = new AC();
      const master = audioCtx.createGain();
      master.gain.value = 0;
      const shape = audioCtx.createWaveShaper();
      const curve = new Float32Array(256);
      for (let i = 0; i < 256; i++) {
        const x = (i / 255) * 2 - 1;
        curve[i] = Math.tanh(x * 2.4);
      }
      shape.curve = curve;
      shape.oversample = "2x";
      const filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 480;
      filter.Q.value = 0.7;
      const osc = audioCtx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.value = 55;
      const osc2 = audioCtx.createOscillator();
      osc2.type = "sawtooth";
      osc2.frequency.value = 110;
      const g2 = audioCtx.createGain();
      g2.gain.value = 0.28;
      const sub = audioCtx.createOscillator();
      sub.type = "sine";
      sub.frequency.value = 28;
      const gs = audioCtx.createGain();
      gs.gain.value = 0.55;
      const noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
      const nd = noiseBuf.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuf;
      noise.loop = true;
      const nFilter = audioCtx.createBiquadFilter();
      nFilter.type = "bandpass";
      nFilter.frequency.value = 180;
      nFilter.Q.value = 0.6;
      const gn = audioCtx.createGain();
      gn.gain.value = 0.12;
      osc.connect(shape);
      osc2.connect(g2);
      g2.connect(shape);
      sub.connect(gs);
      gs.connect(shape);
      noise.connect(nFilter);
      nFilter.connect(gn);
      gn.connect(shape);
      shape.connect(filter);
      filter.connect(master);
      master.connect(audioCtx.destination);
      osc.start();
      osc2.start();
      sub.start();
      noise.start();
      engine = { osc: osc, osc2: osc2, sub: sub, filter: filter, nFilter: nFilter, master: master };
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function updateEngine(dt) {
    if (!engine) return;
    const driving = phase === "race" || phase === "count";
    const sp = clamp(speed / maxSpeed, 0, 1);
    const brake = phase === "race" && !!(held.ArrowDown || held.s);
    let target = 0.18 + sp * 0.82;
    if (brake) target = 0.12 + sp * 0.28;
    rpm += (target - rpm) * (1 - Math.exp(-dt * (brake ? 8 : 3.2)));
    const freq = 52 + rpm * 168;
    engine.osc.frequency.value = freq;
    engine.osc2.frequency.value = freq * 2.015;
    engine.sub.frequency.value = freq * 0.5;
    engine.filter.frequency.value = 360 + rpm * 1900;
    engine.nFilter.frequency.value = 140 + rpm * 520;
    const targetVol = driving && !muted ? 0.06 + rpm * 0.12 : 0;
    engineVol += (targetVol - engineVol) * (1 - Math.exp(-dt * (muted || !driving ? 18 : 8)));
    engine.master.gain.value = engineVol;
  }

  function playBump() {
    ensureAudio();
    if (!audioCtx || muted) return;
    if (!bumpGain) {
      bumpGain = audioCtx.createGain();
      bumpGain.connect(audioCtx.destination);
    }
    bumpGain.gain.value = 1;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(170, t);
    osc.frequency.exponentialRampToValueAtTime(52, t + 0.09);
    const og = audioCtx.createGain();
    og.gain.setValueAtTime(0.26, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    osc.connect(og);
    og.connect(bumpGain);
    osc.start(t);
    osc.stop(t + 0.15);
    const len = Math.max(1, Math.floor(audioCtx.sampleRate * 0.07));
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const nf = audioCtx.createBiquadFilter();
    nf.type = "highpass";
    nf.frequency.value = 800;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.16, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    src.connect(nf);
    nf.connect(ng);
    ng.connect(bumpGain);
    src.start(t);
    src.stop(t + 0.08);
  }

  function ensureExtra() {
    if (!audioCtx || extraGain) return;
    extraGain = audioCtx.createGain();
    extraGain.gain.value = muted ? 0 : 1;
    extraGain.connect(audioCtx.destination);
  }

  function stripeKnock(z) {
    const span = SEG * RUMBLE;
    let m = z % span;
    if (m < 0) m += span;
    const s = Math.sin((m / span) * Math.PI);
    const k = s * s;
    return k * k;
  }

  function ensureRumble() {
    if (rumble || !audioCtx || !extraGain) return;
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const bodyF = audioCtx.createBiquadFilter();
    bodyF.type = "bandpass";
    bodyF.frequency.value = 110;
    bodyF.Q.value = 0.8;
    const bodyG = audioCtx.createGain();
    bodyG.gain.value = 0;
    const tickF = audioCtx.createBiquadFilter();
    tickF.type = "highpass";
    tickF.frequency.value = 900;
    const tickG = audioCtx.createGain();
    tickG.gain.value = 0;
    src.connect(bodyF);
    bodyF.connect(bodyG);
    bodyG.connect(extraGain);
    src.connect(tickF);
    tickF.connect(tickG);
    tickG.connect(extraGain);
    src.start();
    rumble = { bodyF: bodyF, bodyG: bodyG, tickG: tickG, mix: 0 };
  }

  function updateRumble(dt) {
    if (!audioCtx) return;
    const ax = Math.abs(playerX);
    const on = phase === "race" && !muted && speed > maxSpeed * 0.04 && ax >= 1 && ax <= 1.2;
    if (!rumble) {
      if (!on) return;
      ensureExtra();
      ensureRumble();
      if (!rumble) return;
    }
    const sp = clamp(speed / maxSpeed, 0, 1);
    const knock = stripeKnock(position);
    rumble.mix += ((on ? 1 : 0) - rumble.mix) * (1 - Math.exp(-dt * 16));
    const bodyTarget = rumble.mix * (0.035 + sp * 0.05) * (0.4 + 0.6 * knock);
    const tickTarget = rumble.mix * knock * (0.07 + sp * 0.12);
    rumble.bodyG.gain.value += (bodyTarget - rumble.bodyG.gain.value) * (1 - Math.exp(-dt * 18));
    rumble.tickG.gain.value = tickTarget;
    rumble.bodyF.frequency.value = 90 + sp * 50;
  }

  function fanNote(freq, start, dur, peak) {
    const osc = audioCtx.createOscillator();
    osc.type = "triangle";
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(peak, start + 0.018);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(g);
    g.connect(extraGain);
    osc.start(start);
    osc.stop(start + dur + 0.02);
  }

  function playFanfare() {
    ensureAudio();
    if (!audioCtx || muted) return;
    ensureExtra();
    const t = audioCtx.currentTime;
    const lead = [523.25, 659.25, 783.99];
    for (let i = 0; i < lead.length; i++) fanNote(lead[i], t + i * 0.08, 0.2, 0.12);
    const chord = [523.25, 659.25, 783.99, 1046.5];
    for (let i = 0; i < chord.length; i++) fanNote(chord[i], t + 0.26, 0.34, 0.05);
  }

  function updateDriveSfx(dt) {
    if (phase === "goal") {
      if (!goalChimed) {
        goalChimed = true;
        playFanfare();
      }
    } else {
      goalChimed = false;
    }
    updateRumble(dt);
  }

  window.addEventListener("keydown", function (e) {
    const k = normKey(e.key);
    ensureAudio();
    if (k === "Escape") {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) exit.call(document);
      }
      return;
    }
    if (k === "f") {
      if (!held.f) toggleFullscreen();
      held.f = true;
      return;
    }
    if (k === "m") {
      if (!held.m) {
        muted = !muted;
        if (bumpGain) bumpGain.gain.value = muted ? 0 : 1;
        if (extraGain) extraGain.gain.value = muted ? 0 : 1;
      }
      held.m = true;
      return;
    }
    if (k === "ArrowUp" || k === "ArrowDown" || k === "ArrowLeft" || k === "ArrowRight" || k === " " || k === "Spacebar")
      e.preventDefault();
    if (k === "r") {
      if (!held.r) {
        if (phase === "goal" || phase === "fail") showTitle();
        else if (phase !== "title") restart();
      }
      held.r = true;
      return;
    }
    if (k === " " || k === "Spacebar") {
      enterFullscreen();
      if (!held[" "] && (phase === "title" || phase === "ready")) beginCountdown();
      held[" "] = true;
      return;
    }
    held[k] = true;
  }, { passive: false });

  window.addEventListener("keyup", function (e) {
    held[normKey(e.key)] = false;
  });

  window.addEventListener("blur", function () {
    for (const k in held) held[k] = false;
  });

  window.addEventListener("click", function onFirstClick() {
    window.removeEventListener("click", onFirstClick);
    enterFullscreen();
  });

  window.addEventListener("resize", resize);
  document.addEventListener("fullscreenchange", resize);
  document.addEventListener("webkitfullscreenchange", resize);

  buildCourse(1);
  resize();

  let last = performance.now();
  let acc = 0;
  const STEP = 1 / 60;

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;
    if (dt < 0) dt = 0;
    acc += dt;
    while (acc >= STEP) {
      update(STEP);
      acc -= STEP;
    }
    updateEngine(dt);
    updateDriveSfx(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
